<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laskin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body onload="init()">

    <div class="container p-5">
        <h1 class="text-center mb-4">Laskin</h1>
        <div class="d-flex gap-3">

            <div class="input-group">
                <button class="btn btn-primary" onclick="minusNro1()">-</button>
                <input class="form-control text-center" id="num1" type="number">
                <button class="btn btn-primary" onclick="plusNro1()">+</button>
            </div>

            <select id="operation" class="form-select">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>

            <div class="input-group">
                <button class="btn btn-primary" onclick="minusNro2()">-</button>
                <input class="form-control text-center" id="num2" type="number">
                <button class="btn btn-primary" onclick="plusNro2()">+</button>
            </div>

        </div>

        <div class="mt-4 d-grid gap-2">
            <button class="btn btn-success" onclick="calculate()">LASKE</button>
            <h2 id="tulos" class="text-center">-</h2>
            <p id="clicks"></p>
            <div id="history"></div>
        </div>

    </div>

    <script src="js/laskin.js"></script>

</body>

</html>
