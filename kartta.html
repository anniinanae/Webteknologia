<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osoitteen haku kartalta</title>

    <!-- favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!-- css -->
    <link rel="stylesheet" href="css/kartta.css">


</head>

<body>
    <div class="container">
        <h2>Hae osoite kartalta</h2>

        <div class="form-group">
            <label for="addr-field">Katuosoite:</label>
            <input type="text" id="addr-field" placeholder="Esim. Yliopistonkatu 36">
        </div>

        <div class="form-group">
            <label for="city-field">Kaupunki:</label>
            <input type="text" id="city-field" placeholder="Esim. Lappeenranta">
        </div>

        <button onclick="haeKartta()">HAE</button>

        <iframe id="map-frame"></iframe>
    </div>

    <script defer src="js/kartta.js"></script>
</body>

</html>
