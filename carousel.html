<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="css/carousel.css">
    <link rel="icon" href="favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</head>

<body>
    <div class="mx-auto p-2" style="width: 300px;">
        <div class="card" style="width: 18rem;">
            <h1>Kuvakaruselli</h1>
            <img id="catImage" src="kuvat/Kissa1.jpg" class="card-img-top">
            <div class="card-body">
                <p class="card-text" align="center" id="catName">Mauno</p>
            </div>

            <div class="media text-center">
                <img id="kuva" src="img-fluid rounded">
                <h3 id="otsikko"></h3>
                <p id="teksti"></p>
            </div>

            <div class="buttons">
                <button id="prev">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <button id="play">
                    <i class="bi bi-play-fill"></i>
                </button>
                <button id="next" onclick="showNext()">
                    <i class="bi bi-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
    <script src="js/carousel.js"></script>
</body>
