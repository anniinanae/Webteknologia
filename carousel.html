<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>Kuvakaruselli</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body onload="init()">

    <div class="mx-auto p-2" style="width: 300px;">
        <div class="card">

            <h3 class="text-center mt-2">Kuvakaruselli</h3>

            <img id="catImage" class="card-img-top">

            <div class="card-body">
                <p class="text-center" id="catName"></p>
            </div>

            <div class="text-center mb-3">
                <button onclick="showPrevious()">
                    <i class="bi bi-arrow-left"></i>
                </button>

                <button onclick="togglePlay()" id="playBtn">
                    <i class="bi bi-play-fill"></i>
                </button>

                <button onclick="showNext()">
                    <i class="bi bi-arrow-right"></i>
                </button>
            </div>

        </div>
    </div>

    <script src="js/carousel.js"></script>

</body>

</html>
