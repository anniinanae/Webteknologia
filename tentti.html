<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzeria tentti</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link rel="stylesheet" href="css/tentti.css">

</head>

<body onload="init()">
    <div class="container p-5">
        <div id="image-container" class="grid-container shadow p-4 rounded bg-light">

            <div class="grid-item">
                <img src="kuvat/pizza.jpg" alt="Herkullinen pizza" class="img-fluid">
            </div>

            <h1 class="text-center mb-4">Tilaa pizza</h1>

            <div class="mb-4">
                <label for="operation" class="form-label fw-bold">Valitse koko</label>
                <select id="operation" class="form-select" onchange="laskeHinta()">
                    <option value="0">Valitse</option>
                    <option value="6">Tavallinen pizza (6€)</option>
                    <option value="12">Perhepizza (12€)</option>
                </select>
            </div>

            <fieldset class="mb-4">
                <legend class="h5 fw-bold">Valitse täytteet (2€/kpl)</legend>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="taytteet" value="2" id="kinkku"
                        onchange="laskeHinta()">
                    <label class="form-check-label" for="kinkku">Kinkku</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="taytteet" value="2" id="ananas"
                        onchange="laskeHinta()">
                    <label class="form-check-label" for="ananas">Ananas</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="taytteet" value="2" id="pepperoni"
                        onchange="laskeHinta()">
                    <label class="form-check-label" for="pepperoni">Pepperoni</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="taytteet" value="2" id="aurajuusto"
                        onchange="laskeHinta()">
                    <label class="form-check-label" for="pepperoni">Aurajuusto</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="taytteet" value="2" id="tonnikala"
                            onchange="laskeHinta()">
                        <label class="form-check-label" for="pepperoni">Tonnikala</label>
                    </div>
                </div>
            </fieldset>

            <div class="mb-4">
                <label for="hinta" class="form-label fw-bold">Hinta yhteensä (€)</label>
                <input type="text" id="hinta" class="form-control-plaintext fs-4 text-primary fw-bold" value="0"
                    readonly>
            </div>

            <div class="d-grid">

                <button class="btn btn-primary btn-lg" onclick="tilaaPizza()">
                    <i class="bi bi-cart-fill"></i> Tilaa
                </button>
            </div>
        </div>
    </div>
    <script src="js/tentti.js"></script>
</body>

</html>
