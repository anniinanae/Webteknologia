<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX-tehtävä</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>

</head>

<body style="background-color: rgb(180, 200, 231);">

    <div class="container-fluid p-5 d-flex gap-5">
        <div class="border p-4 bg-white" style="width: 450px;">
            <h2 style="color: rgb(109, 192, 212);">Hae satunnainen vitsi</h2>

            <button id="button" class="btn mt-3" style="background-color: rgb(181, 218, 248); color: white;">
                HAE
            </button>

            <br><br>


            <p id="clicks">Laskuri: 0</p>
            <p id="text"></p>
        </div>
        <div class="border p-4 bg-white" style="width: 500px;">

            <h2 style="color: rgb(172, 255, 248);">jQuery UI Accordion</h2>

            <div id="accordion">

                <h3 class="jq-header" data-target="p1">1. Haku</h3>
                <div>
                    <p id="p1"></p>
                </div>

                <h3 class="jq-header" data-target="p2">2. Haku</h3>
                <div>
                    <p id="p2"></p>
                </div>

            </div>

            <br>

            <h2 style="color: rgb(132, 205, 235);">Bootstrap Accordion</h2>

            <div class="accordion" id="bsAccordion">

                <div class="accordion-item">

                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed bs-btn" data-target="b1" data-bs-toggle="collapse"
                            data-bs-target="#c1">
                            1. Haku
                        </button>
                    </h2>

                    <div id="c1" class="accordion-collapse collapse">
                        <div class="accordion-body" id="b1"></div>
                    </div>

                </div>

                <div class="accordion-item">

                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed bs-btn" data-target="b2" data-bs-toggle="collapse"
                            data-bs-target="#c2">
                            2. Haku
                        </button>
                    </h2>

                    <div id="c2" class="accordion-collapse collapse">
                        <div class="accordion-body" id="b2"></div>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/ajax.js"></script>

</body>

</html>
