<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="css/tyylit.css">

</head>

<body>

    <form>

        <fieldset>
            <legend>Henkilötiedot</legend>

            <div class="form-group">
                <label for="fname">Etunimi:</label>
                <input type="text" id="fname" name="fname">
            </div>

            <div class="form-group">
                <label for="lname">Sukunimi:</label>
                <input type="text" id="lname" name="lname">
            </div>

            <div class="form-group">
                <label for="password">Salasana:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-group">
                <label>Valinta:</label>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox" id="emailcontact" name="contact">
                        Sähköposti
                    </label>

                    <label>
                        <input type="checkbox" id="phonecontact" name="contact">
                        Puhelin
                    </label>
                </div>
            </div>

        </fieldset>

        <fieldset>
            <legend>Feedback</legend>

            <div class="form-group">
                <textarea id="message" name="message" rows="8"></textarea>
            </div>

            <div class="form-group">
                <label for="file">Liitä tiedosto:</label>
                <input type="file" id="file" name="file">
            </div>

            <div class="form-group">
                <button type="submit">Lähetä</button>
            </div>

        </fieldset>

    </form>

</body>

</html>
