<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <title>AJAX harjoitus</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        #loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body class="p-4">

    <h2>Hae Chuck Norris -vitsi</h2>

    <!-- Button -->
    <button class="btn btn-primary" onclick="haeData()">Hae vitsi</button>

    <!-- Laskuri -->
    <p class="mt-3">Hakuja tehty: <span id="laskuri">0</span></p>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status"></div>
        <p>Ladataan...</p>
    </div>

    <!-- Accordion -->
    <div class="accordion mt-4" id="accordionExample">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                    API vastaus
                </button>
            </h2>
            <div id="collapseOne" class="accordion-collapse collapse show">
                <div class="accordion-body" id="data">
                    Klikkaa nappia hakeaksesi dataa.
                </div>
            </div>
        </div>
    </div>



    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ajax2.js"></script>

</body>

</html>
