<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista/ruudukko</title>

    <link rel="stylesheet" href="styles (js osa)/lista&ruutu.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>

<body onload="init()">

    <div class="container p-5">

        <h1 class="text-center my-5">Näytä lista tai ruudukko</h1>

        <div class="d-flex justify-content-center gap-2 mb-4">
            <button onclick="Ruudukko()" class="btn btn-info">
                <i class="bi bi-grid"></i>
            </button>

            <button onclick="Lista()" class="btn btn-info">
                <i class="bi bi-list"></i>
            </button>
        </div>

        <div id="grid" class="grid-container">
            <img src="kuvat/kassu.jpg" class="grid-item">
            <img src="kuvat/Kissa1.jpg" class="grid-item">
            <img src="kuvat/Kissa2.jpg" class="grid-item">
            <img src="kuvat/kissa5.jpg" class="grid-item">
            <img src="kuvat/vibin.avif" class="grid-item">
            <img src="kuvat/kissa4.jpg" class="grid-item">
        </div>

    </div>

    <script src="scripts/lista&ruutu.js"></script>

</body>

</html>
