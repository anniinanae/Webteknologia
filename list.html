<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista/ruudukko</title>

    <link rel="stylesheet" href="css/list.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>


<body>

    <div class="container p-5">

        <h1 class="text-center my-5 py-2 otsikko" ;>Näytä lista tai ruudukko</h1>


        <div id="show" class="container">

            <div class="d-flex justify-content-center column-gap-1">
                <button class="btn btn-outline-primary" onclick="Ruudukko()"><i class="bi bi-grid"></i></button>
                <button class="btn btn-outline-primary" onclick="Lista()"><i class="bi bi-list"></i></button>
            </div>

            <div id="image-container" class="grid-container">
                <div class="grid-item"><img src="kuvat/Kissa1.jpg" alt=""></div>
                <div class="grid-item"><img src="kuvat/kisu.jpg" alt=""></div>
                <div class="grid-item"><img src="kuvat/kisu3.jpg" alt=""></div>
                <div class="grid-item"><img src="kuvat/koira.jpg" alt=""></div>
                <div class="grid-item"><img src="kuvat/kissa5.jpg" alt=""></div>
                <div class="grid-item"><img src="kuvat/kissa4.jpg" alt=""></div>
            </div>
        </div>
    </div>


    <script defer src="js/list.js"> </script>

</body>

</html>
