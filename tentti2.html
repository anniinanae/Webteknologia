<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vuokraa polkupyörä</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/tentti2.css">
</head>

<body>
    <form id="bikeForm">

        <div class="container py-5">

            <div class="bike-card p-4">

                <h1 class="text-center mb-4">Vuokraa polkupyörä</h1>

                <div class="row g-4 align-items-start">

                    <div class="col-md-5 text-center">
                        <div class="bike-image-wrapper">

                            <img src="kuvat/pyörä.jpg" class="bike-img" alt="Polkupyörä">

                            <div class="info-row mt-2">
                                <span id="info" class="info-btn">Polkupyörä &#9432;</span>
                            </div>


                            <div id="infoText" class="info-text mt-2">
                                Maastopyörä aikuiselle. Kevyt alumiinirunko, 7 vaihdetta,
                                sopii asfaltille ja maastoon. Helppo kasata. Ketjut ei lähde. Kestävät renkaat.
                            </div>

                        </div>
                    </div>

                    <div class="col-md-7">

                        <label class="form-label">Palvelu</label>
                        <select id="service" class="form-select">
                            <option value="" data-price="0">Valitse palvelu</option>
                            <option value="pika" data-price="15">Pikavuokraus 2h</option>
                            <option value="paiva" data-price="30">Päivävuokraus 8h</option>
                            <option value="vuorokausi" data-price="40">Vuorokausivuokraus 19h</option>
                            <option value="viikonloppu" data-price="60">Viikonloppuvuokra pe-su</option>
                        </select>

                        <div class="mt-3">
                            <label class="form-label">Polkupyörien määrä</label>

                            <div class="input-group">
                                <button id="minusBtn" class="btn btn-outline-secondary" type="button">-</button>
                                <input id="qty" type="text" class="form-control text-center" value="0 kpl"></readonly>
                                <button id="plusBtn" class="btn btn-outline-secondary" type="button">+</button>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label class="form-label">Hinta yhteensä</label>
                            <input id="totalPrice" type="text" class="form-control" value="0 €" readonly>
                        </div>


                        <div class="d-grid gap-2 mt-3">
                            <button type="reset" class="btn btn-outline-secondary btn-lg">
                                Varaa
                            </button>

                        </div>
                    </div>

                </div>
            </div>

        </div>
        </div>

        <script src="js/tentti2.js"></script>
    </form>

</body>

</html>
